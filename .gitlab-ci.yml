stages:
  - quality
  - test
  - build
  - security
  - publish
  - deploy
  - e2e

variables:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  NEXT_PUBLIC_API_BASE_URL: "http://localhost"
  BACKEND_INTERNAL_URL: "http://localhost:8000"
  AI_API_KEY: "ci-placeholder"
  AI_API_URL: "http://localhost:11434/v1"
  AI_MODEL: "qwen2.5:3b"
  POSTGRES_DB: "sozlution_test"
  POSTGRES_USER: "sozlution"
  POSTGRES_PASSWORD: "sozlution"
  POSTGRES_DSN: "postgresql://sozlution:sozlution@postgres:5432/sozlution_test"
  TEST_POSTGRES_DSN: "postgresql://sozlution:sozlution@postgres:5432/sozlution_test"
  ENABLE_SQLITE_FALLBACK: "false"
  SECRET_KEY: "ci-secret-key"
  BACKEND_CORS_ORIGINS: '["http://localhost","http://localhost:3000"]'
  FRONTEND_BASE_URL: "http://localhost:3000"

.frontend_base:
  image: node:${NODE_VERSION}-alpine
  cache:
    key:
      files:
        - frontend/pnpm-lock.yaml
    paths:
      - frontend/.pnpm-store
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - cd frontend
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

.backend_base:
  image: python:${PYTHON_VERSION}-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  cache:
    key:
      files:
        - backend/requirements.txt
    paths:
      - .cache/pip
  before_script:
    - cd backend
    - python -m pip install --upgrade pip
    - pip install --cache-dir ../.cache/pip -r requirements.txt

frontend:lint:
  extends: .frontend_base
  stage: quality
  script:
    - pnpm lint

frontend:test:
  extends: .frontend_base
  stage: test
  script:
    - pnpm test

frontend:build:
  extends: .frontend_base
  stage: build
  script:
    - pnpm build
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - frontend/.next

backend:test:
  extends: .backend_base
  stage: test
  script:
    - alembic upgrade head
    - pytest

docker:build-smoke:
  image: docker:27
  stage: build
  services:
    - name: docker:27-dind
      alias: docker
  needs:
    - frontend:build
    - backend:test
  before_script:
    - docker info
  script:
    - docker build --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost --build-arg BACKEND_INTERNAL_URL=http://backend:8000 --build-arg AI_API_KEY=ci-placeholder --build-arg AI_API_URL=http://ollama:11434/v1 --build-arg AI_MODEL=qwen2.5:3b -t sozlution-frontend-ci -f frontend/Dockerfile frontend
    - docker build -t sozlution-backend-ci -f backend/Dockerfile backend
    - docker build -t sozlution-nginx-ci -f nginx/Dockerfile nginx

security:frontend-audit:
  extends: .frontend_base
  stage: security
  script:
    - pnpm audit --audit-level critical

security:backend-audit:
  image: python:${PYTHON_VERSION}-slim
  stage: security
  before_script:
    - python -m pip install --upgrade pip
    - pip install pip-audit
  script:
    - pip-audit -r backend/requirements.txt

docker:publish:
  image: docker:27
  stage: publish
  services:
    - name: docker:27-dind
      alias: docker
  needs:
    - docker:build-smoke
    - security:frontend-audit
    - security:backend-audit
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - export IMAGE_TAG="${CI_COMMIT_TAG:-sha-${CI_COMMIT_SHORT_SHA}}"
    - docker build --build-arg NEXT_PUBLIC_API_BASE_URL="${NEXT_PUBLIC_API_BASE_URL}" --build-arg BACKEND_INTERNAL_URL="${BACKEND_INTERNAL_URL}" --build-arg AI_API_KEY="${AI_API_KEY}" --build-arg AI_API_URL="${AI_API_URL}" --build-arg AI_MODEL="${AI_MODEL}" -t "$CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG" -t "$CI_REGISTRY_IMAGE/frontend:latest" -f frontend/Dockerfile frontend
    - docker build -t "$CI_REGISTRY_IMAGE/backend:$IMAGE_TAG" -t "$CI_REGISTRY_IMAGE/backend:latest" -f backend/Dockerfile backend
    - docker build -t "$CI_REGISTRY_IMAGE/nginx:$IMAGE_TAG" -t "$CI_REGISTRY_IMAGE/nginx:latest" -f nginx/Dockerfile nginx
    - docker push "$CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE/backend:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE/nginx:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE/frontend:latest"
    - docker push "$CI_REGISTRY_IMAGE/backend:latest"
    - docker push "$CI_REGISTRY_IMAGE/nginx:latest"

deploy:staging:
  image: alpine:3.20
  stage: deploy
  needs:
    - docker:publish
  environment:
    name: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  script:
    - echo "Staging deploy stub. VPS is not configured yet."
    - echo "Future commands:"
    - echo "docker login $CI_REGISTRY"
    - echo "docker compose pull"
    - echo "docker compose up -d --remove-orphans"
    - echo "docker compose ps"

deploy:production:
  image: alpine:3.20
  stage: deploy
  needs:
    - docker:publish
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
  script:
    - echo "Production deploy stub. VPS is not configured yet."
    - echo "Approved image tag ${CI_COMMIT_TAG:-sha-${CI_COMMIT_SHORT_SHA}}"
    - echo "Future commands:"
    - echo "docker login $CI_REGISTRY"
    - echo "docker compose pull"
    - echo "docker compose up -d --remove-orphans"
    - echo "docker compose ps"

e2e:playwright:
  extends: .frontend_base
  stage: e2e
  services:
    - name: postgres:16-alpine
      alias: postgres
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - when: never
  before_script:
    - apk add --no-cache python3 py3-pip curl bash
    - cd backend
    - python3 -m venv .venv
    - . .venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - alembic upgrade head
    - python app/scripts/import_words.py data.generated.json
    - nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > ../backend.log 2>&1 &
    - for i in $(seq 1 30); do curl -fsS http://localhost:8000/ping && break || sleep 2; done
    - cd ../frontend
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    - pnpm exec playwright install --with-deps chromium
  script:
    - pnpm test:e2e
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - backend.log
      - frontend/test-results
      - frontend/playwright-report
