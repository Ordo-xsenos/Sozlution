openapi: 3.1.0
info:
  title: Sozlution Backend
  version: 0.1.0
paths:
  /api/v1/session:
    post:
      tags:
      - auth
      summary: Create Session
      operationId: create_session_api_v1_session_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/password-reset/request:
    post:
      tags:
      - auth
      summary: Request Password Reset
      operationId: request_password_reset_api_v1_password_reset_request_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/password-reset/confirm:
    post:
      tags:
      - auth
      summary: Confirm Password Reset
      operationId: confirm_password_reset_api_v1_password_reset_confirm_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/user:
    get:
      tags:
      - users
      summary: Get User
      operationId: get_user_api_v1_user_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      security:
      - HTTPBearer: []
    patch:
      tags:
      - users
      summary: Patch User
      operationId: patch_user_api_v1_user_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/words/{en}/audio:
    get:
      tags:
      - study
      summary: Get Word Audio Metadata
      operationId: get_word_audio_metadata_api_v1_words__en__audio_get
      security:
      - HTTPBearer: []
      parameters:
      - name: en
        in: path
        required: true
        schema:
          type: string
          title: En
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WordAudioOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/words/{en}/audio/file:
    get:
      tags:
      - study
      summary: Get Word Audio File
      operationId: get_word_audio_file_api_v1_words__en__audio_file_get
      security:
      - HTTPBearer: []
      parameters:
      - name: en
        in: path
        required: true
        schema:
          type: string
          title: En
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/test/questions:
    get:
      tags:
      - study
      summary: Get Test Questions
      operationId: get_test_questions_api_v1_test_questions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/v1/test/submit:
    post:
      tags:
      - study
      summary: Submit Test
      operationId: submit_test_api_v1_test_submit_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestSubmitIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TestSubmitOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/plan/generate:
    post:
      tags:
      - study
      summary: Generate Plan
      operationId: generate_plan_api_v1_plan_generate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanGenerateIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/plan:
    get:
      tags:
      - study
      summary: Get Plan
      operationId: get_plan_api_v1_plan_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/v1/day/current:
    get:
      tags:
      - study
      summary: Get Day Current
      operationId: get_day_current_api_v1_day_current_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/v1/day/complete:
    post:
      tags:
      - study
      summary: Complete Day
      operationId: complete_day_api_v1_day_complete_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayCompleteIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/stats:
    get:
      tags:
      - study
      summary: Get Stats
      operationId: get_stats_api_v1_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/v1/results:
    get:
      tags:
      - study
      summary: Get Results
      operationId: get_results_api_v1_results_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/v1/export:
    get:
      tags:
      - study
      summary: Export Data
      operationId: export_data_api_v1_export_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/v1/import:
    post:
      tags:
      - study
      summary: Import Data
      operationId: import_data_api_v1_import_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/reset-progress:
    post:
      tags:
      - study
      summary: Reset Progress
      operationId: reset_progress_api_v1_reset_progress_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkOut'
      security:
      - HTTPBearer: []
  /api/v1/ai/snippets:
    post:
      tags:
      - ai
      summary: Ai Snippets
      operationId: ai_snippets_api_v1_ai_snippets_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiSnippetsIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/ai/chat:
    post:
      tags:
      - ai
      summary: Ai Chat
      operationId: ai_chat_api_v1_ai_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiChatIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiChatOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/ai/word-assist:
    post:
      tags:
      - ai
      summary: Ai Word Assist
      operationId: ai_word_assist_api_v1_ai_word_assist_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiWordAssistIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiWordAssistOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/ielts-mode/vocabulary:
    get:
      tags:
      - ielts-mode
      summary: Get Vocabulary
      operationId: get_vocabulary_api_v1_ielts_mode_vocabulary_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  items:
                    $ref: '#/components/schemas/IELTSWordOut'
                  type: array
                type: object
                title: Response Get Vocabulary Api V1 Ielts Mode Vocabulary Get
      security:
      - HTTPBearer: []
  /api/v1/ielts-mode/writing/tasks:
    get:
      tags:
      - ielts-mode
      summary: Get Writing Task
      operationId: get_writing_task_api_v1_ielts_mode_writing_tasks_get
      security:
      - HTTPBearer: []
      parameters:
      - name: type
        in: query
        required: true
        schema:
          enum:
          - task1
          - task2
          type: string
          title: Type
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IELTSWritingTaskOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ielts-mode/writing/evaluate:
    post:
      tags:
      - ielts-mode
      summary: Evaluate Writing
      operationId: evaluate_writing_api_v1_ielts_mode_writing_evaluate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IELTSWritingEvaluateIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IELTSWritingEvaluateOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/ielts-mode/mock-tests:
    get:
      tags:
      - ielts-mode
      summary: List Mock Tests
      operationId: list_mock_tests_api_v1_ielts_mode_mock_tests_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/IELTSMockTestListOut'
                type: array
                title: Response List Mock Tests Api V1 Ielts Mode Mock Tests Get
      security:
      - HTTPBearer: []
  /api/v1/ielts-mode/mock-tests/{id}:
    get:
      tags:
      - ielts-mode
      summary: Get Mock Test
      operationId: get_mock_test_api_v1_ielts_mode_mock_tests__id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IELTSMockTestOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ielts-mode/mock-tests/{id}/submit:
    post:
      tags:
      - ielts-mode
      summary: Submit Mock Test
      operationId: submit_mock_test_api_v1_ielts_mode_mock_tests__id__submit_post
      security:
      - HTTPBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          title: Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IELTSMockTestSubmitIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IELTSMockTestSubmitOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/ielts-mode/stats:
    get:
      tags:
      - ielts-mode
      summary: Get Stats
      operationId: get_stats_api_v1_ielts_mode_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IELTSStatsOut'
      security:
      - HTTPBearer: []
  /:
    get:
      summary: Read Root
      operationId: read_root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    AiChatIn:
      properties:
        message:
          type: string
          title: Message
        history:
          items:
            $ref: '#/components/schemas/AiChatTurn'
          type: array
          title: History
      type: object
      required:
      - message
      title: AiChatIn
    AiChatOut:
      properties:
        text:
          type: string
          title: Text
      type: object
      required:
      - text
      title: AiChatOut
    AiChatTurn:
      properties:
        role:
          type: string
          title: Role
          default: user
        text:
          type: string
          title: Text
          default: ''
      type: object
      title: AiChatTurn
    AiSnippetsIn:
      properties:
        words:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Words
      type: object
      required:
      - words
      title: AiSnippetsIn
    AiWordAssistIn:
      properties:
        word_id:
          type: string
          title: Word Id
          default: ''
        word:
          type: string
          maxLength: 120
          title: Word
        lang:
          type: string
          title: Lang
        hint:
          type: string
          title: Hint
          default: ''
      type: object
      required:
      - word
      - lang
      title: AiWordAssistIn
    AiWordAssistOut:
      properties:
        translation:
          type: string
          title: Translation
        description:
          type: string
          title: Description
        level:
          type: string
          title: Level
          default: B1
      type: object
      required:
      - translation
      - description
      title: AiWordAssistOut
    DayCompleteIn:
      properties:
        day:
          type: integer
          minimum: 1.0
          title: Day
        step1:
          additionalProperties:
            type: boolean
          type: object
          title: Step1
        step2:
          additionalProperties:
            type: boolean
          type: object
          title: Step2
        step3:
          additionalProperties:
            type: integer
          type: object
          title: Step3
      type: object
      required:
      - day
      - step1
      - step2
      - step3
      title: DayCompleteIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IELTSCriteriaDetail:
      properties:
        score:
          type: number
          title: Score
        feedback:
          type: string
          title: Feedback
      type: object
      required:
      - score
      - feedback
      title: IELTSCriteriaDetail
    IELTSMockTestListOut:
      properties:
        id:
          type: string
          title: Id
        title:
          type: string
          title: Title
        type:
          type: string
          title: Type
        difficulty:
          type: string
          title: Difficulty
      type: object
      required:
      - id
      - title
      - type
      - difficulty
      title: IELTSMockTestListOut
    IELTSMockTestOut:
      properties:
        id:
          type: string
          title: Id
        sections:
          items:
            $ref: '#/components/schemas/IELTSMockTestSectionOut'
          type: array
          title: Sections
      type: object
      required:
      - id
      - sections
      title: IELTSMockTestOut
    IELTSMockTestQuestionOut:
      properties:
        id:
          type: string
          title: Id
        type:
          type: string
          title: Type
        text:
          type: string
          title: Text
        options:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Options
      type: object
      required:
      - id
      - type
      - text
      title: IELTSMockTestQuestionOut
    IELTSMockTestSectionOut:
      properties:
        content:
          type: string
          title: Content
        questions:
          items:
            $ref: '#/components/schemas/IELTSMockTestQuestionOut'
          type: array
          title: Questions
      type: object
      required:
      - content
      - questions
      title: IELTSMockTestSectionOut
    IELTSMockTestSubmitIn:
      properties:
        answers:
          additionalProperties:
            type: string
          type: object
          title: Answers
      type: object
      required:
      - answers
      title: IELTSMockTestSubmitIn
    IELTSMockTestSubmitOut:
      properties:
        correct_count:
          type: integer
          title: Correct Count
        total_questions:
          type: integer
          title: Total Questions
        band_score:
          type: number
          title: Band Score
      type: object
      required:
      - correct_count
      - total_questions
      - band_score
      title: IELTSMockTestSubmitOut
    IELTSStatsOut:
      properties:
        estimated_band:
          type: number
          title: Estimated Band
        target_band:
          type: number
          title: Target Band
        writing_tasks_completed:
          type: integer
          title: Writing Tasks Completed
        vocabulary_mastered:
          type: integer
          title: Vocabulary Mastered
        mock_tests_count:
          type: integer
          title: Mock Tests Count
        activity_heatmap:
          additionalProperties:
            type: integer
          type: object
          title: Activity Heatmap
      type: object
      required:
      - estimated_band
      - target_band
      - writing_tasks_completed
      - vocabulary_mastered
      - mock_tests_count
      title: IELTSStatsOut
    IELTSWordOut:
      properties:
        id:
          type: string
          title: Id
        en:
          type: string
          title: En
        ru:
          type: string
          title: Ru
        uz:
          type: string
          title: Uz
        definition:
          type: string
          title: Definition
        transcription:
          anyOf:
          - type: string
          - type: 'null'
          title: Transcription
        topic:
          type: string
          title: Topic
        example:
          type: string
          title: Example
      type: object
      required:
      - id
      - en
      - ru
      - uz
      - definition
      - transcription
      - topic
      - example
      title: IELTSWordOut
    IELTSWritingEvaluateIn:
      properties:
        task_id:
          type: string
          title: Task Id
        content:
          type: string
          title: Content
      type: object
      required:
      - task_id
      - content
      title: IELTSWritingEvaluateIn
    IELTSWritingEvaluateOut:
      properties:
        overall_band:
          type: number
          title: Overall Band
        criteria:
          additionalProperties:
            $ref: '#/components/schemas/IELTSCriteriaDetail'
          type: object
          title: Criteria
        improvement_suggestions:
          items:
            type: string
          type: array
          title: Improvement Suggestions
      type: object
      required:
      - overall_band
      - criteria
      - improvement_suggestions
      title: IELTSWritingEvaluateOut
    IELTSWritingTaskOut:
      properties:
        id:
          type: string
          title: Id
        title:
          type: string
          title: Title
        prompt:
          type: string
          title: Prompt
        image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Url
        min_words:
          type: integer
          title: Min Words
        time_limit:
          type: integer
          title: Time Limit
      type: object
      required:
      - id
      - title
      - prompt
      - image_url
      - min_words
      - time_limit
      title: IELTSWritingTaskOut
    ImportIn:
      properties:
        user:
          additionalProperties: true
          type: object
          title: User
        plan:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Plan
        results:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Results
        stats:
          additionalProperties: true
          type: object
          title: Stats
      type: object
      required:
      - user
      - results
      - stats
      title: ImportIn
    Language:
      type: string
      enum:
      - uz
      - ru
      title: Language
    Level:
      type: string
      enum:
      - A1
      - A2
      - B1
      - B2
      - C1
      title: Level
    OkOut:
      properties:
        ok:
          type: boolean
          title: Ok
          default: true
      type: object
      title: OkOut
    PasswordResetConfirmIn:
      properties:
        token:
          type: string
          minLength: 1
          title: Token
        password:
          type: string
          minLength: 8
          title: Password
      type: object
      required:
      - token
      - password
      title: PasswordResetConfirmIn
    PasswordResetRequestIn:
      properties:
        email:
          type: string
          maxLength: 255
          minLength: 3
          format: email
          title: Email
      type: object
      required:
      - email
      title: PasswordResetRequestIn
    PlanGenerateIn:
      properties:
        level:
          $ref: '#/components/schemas/Level'
      type: object
      required:
      - level
      title: PlanGenerateIn
    SessionCreate:
      properties:
        mode:
          type: string
          enum:
          - login
          - register
          title: Mode
          default: register
